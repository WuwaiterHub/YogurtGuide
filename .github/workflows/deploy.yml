name: Deploy

# 兩邊分開部署，檢查指令都是 npm run check:deploy。
# - GitHub Pages：這個 workflow。檢查失敗就不上線。
# - Cloudflare Workers：Cloudflare 自己的 Git 連線，Build command 也設成 npm run check:deploy，Deploy command 用 npx wrangler deploy（讀 wrangler.toml）。
# 不要把 Cloudflare token 放進 GitHub secrets，也不要在這裡用 wrangler 上傳。
# - verify-cloudflare：Cloudflare 有時收不到 push。這裡只讀正式網站公開的 /build.json，
#   裡面的 commit 和這次 push 不同就讓 workflow 失敗，GitHub 會寄通知。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

      - name: Check and build
        run: npm run check:deploy

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy-github:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EXPECTED: ${{ github.sha }}
      BUILD_URL: https://yogurtguide.wuwaiter.com/build.json
    steps:
      - name: Wait for Cloudflare to serve this commit
        run: |
          # Cloudflare 建置約 1–3 分鐘。每分鐘查一次，最多 15 次。
          for attempt in $(seq 1 15); do
            sleep 60
            live=$(curl -fsS "${BUILD_URL}?run=${GITHUB_RUN_ID}-${attempt}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit)}catch{console.log('')}})" || true)
            echo "第 ${attempt} 次：正式網站 ${live:-讀不到}，預期 ${EXPECTED}"
            # Cloudflare 給的可能是短 SHA，用前綴比對。
            if [ -n "$live" ] && [ "${EXPECTED#"$live"}" != "$EXPECTED" ]; then
              echo "Cloudflare 已部署這個 commit。"
              exit 0
            fi
          done
          echo "::error::15 分鐘後正式網站仍不是這個 commit。Cloudflare 可能沒收到這次 push，請到 Cloudflare 後台重新建置，或推一個空 commit。"
          exit 1
